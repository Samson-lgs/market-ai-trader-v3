services:
  - type: web
    name: market-ai-trader-v4-realtime
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: TWELVE_DATA_API_KEY
        sync: false
      - key: TWELVE_DATA_WS_URL
        value: wss://ws.twelvedata.com/v1/quotes/price
      - key: ALLOWED_ORIGIN
        sync: false
